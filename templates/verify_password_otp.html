<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Verify OTP</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-container {
        width: 100%;
        max-width: 420px;
        padding: 20px;
      }

      .login-box {
        background: #ffffff;
        padding: 35px;
        border-radius: 12px;

        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #222;
      }

      .info {
        text-align: center;
        color: #555;
        margin-bottom: 20px;
        line-height: 1.5;
      }

      .error {
        background: #ffe5e5;
        color: #d00000;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 15px;
        text-align: center;
      }

      input {
        width: 100%;
        padding: 13px;
        border: 1px solid #ccc;
        border-radius: 6px;

        font-size: 18px;
        text-align: center;
        letter-spacing: 5px;

        margin-bottom: 18px;
      }

      input:focus {
        outline: none;
        border-color: #007bff;
      }

      button {
        width: 100%;
        padding: 13px;

        border: none;
        border-radius: 6px;

        background: #007bff;
        color: white;

        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }

      .back {
        display: block;
        text-align: center;

        margin-top: 20px;

        color: #007bff;
        text-decoration: none;
      }

      .back:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <div class="login-box">
        <h2>Verify OTP</h2>

        {% with messages = get_flashed_messages() %} {% if messages %} {% for
        message in messages %}
        <p class="error">{{ message }}</p>
        {% endfor %} {% endif %} {% endwith %}

        <p class="info">
          Enter the 6-digit OTP sent to your registered email or mobile number.
        </p>

        <form method="POST" action="{{ url_for('admin.verify_password_otp') }}">
          <input
            type="text"
            name="otp"
            maxlength="6"
            minlength="6"
            pattern="[0-9]{6}"
            inputmode="numeric"
            placeholder="000000"
            required
          />

          <button type="submit">Verify OTP</button>
        </form>

        <a class="back" href="{{ url_for('admin.forgot_password') }}"> Back </a>
      </div>
    </div>
  </body>
</html>
