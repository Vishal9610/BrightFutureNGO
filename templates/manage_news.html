<!doctype html>
<html>
  <head>
    <title>Manage News</title>
  </head>

  <body>
    <h2>Manage News</h2>

    <form method="POST">
      Title

      <br />

      <input type="text" name="title" required />

      <br /><br />

      Description

      <br />

      <textarea name="description" rows="5" cols="50" required></textarea>

      <br /><br />

      Date

      <br />

      <input type="date" name="news_date" required />

      <br /><br />

      <button>Add News</button>
    </form>

    <hr />

    <table border="1" cellpadding="10">
      <tr>
        <th>ID</th>

        <th>Title</th>

        <th>Description</th>

        <th>Date</th>

        <th>Action</th>
      </tr>

      {% for item in news %}

      <tr>
        <td>{{ item[0] }}</td>

        <td>{{ item[1] }}</td>

        <td>{{ item[2] }}</td>

        <td>{{ item[3] }}</td>

        <td>
          <a href="/edit-news/{{ item[0] }}">Edit</a>

          |

          <a
            href="/delete-news/{{ item[0] }}"
            onclick="return confirm('Delete this news?');"
          >
            Delete
          </a>
        </td>
      </tr>

      {% endfor %}
    </table>
  </body>
</html>
