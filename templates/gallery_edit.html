<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Edit Gallery</title>
  </head>

  <body>
    <h2>Edit Gallery Image</h2>

    <form method="POST" enctype="multipart/form-data">
      <label> Gallery Title </label>

      <br /><br />

      <input type="text" name="title" value="{{ photo[1] }}" required />

      <br /><br />

      <label> Current Image </label>

      <br /><br />

      <img
        src="{{ url_for(
            'static',
            filename='uploads/gallery/' + photo[2]
        ) }}"
        width="250"
      />

      <br /><br />

      <label> New Image (Optional) </label>

      <br /><br />

      <input type="file" name="image" accept="image/*" />

      <br /><br />

      <button type="submit">Update</button>
    </form>

    <br />

    <a href="{{ url_for('gallery.gallery_manage') }}"> Back to Gallery </a>
  </body>
</html>
