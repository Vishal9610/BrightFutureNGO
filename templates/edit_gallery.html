<!doctype html>
<html>
  <head>
    <title>Edit Gallery</title>
  </head>

  <body>
    <h2>Edit Gallery Image</h2>

    <form method="POST" enctype="multipart/form-data">
      <label>Title</label>

      <br /><br />

      <input type="text" name="title" value="{{ photo[1] }}" required />

      <br /><br />

      <label>Current Image</label>

      <br /><br />

      <img
        src="{{ url_for('static', filename='uploads/gallery/' + photo[2]) }}"
        width="200"
      />

      <br /><br />

      <label>New Image (Optional)</label>

      <br /><br />

      <input type="file" name="image" />

      <br /><br />

      <button type="submit">Update</button>
    </form>

    <br />

    <a href="/gallery/manage"> Back to Gallery </a>
  </body>
</html>
