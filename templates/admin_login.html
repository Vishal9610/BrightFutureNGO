<!doctype html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/login.css') }}"
    />

    <title>Admin Login - Project Mehar Foundation</title>
  </head>

  <body>
    <div class="login-container">
      <div class="login-box">
        <h2>Admin Login</h2>

        {% with messages = get_flashed_messages() %} {% if messages %} {% for
        message in messages %}
        <p class="error">{{ message }}</p>
        {% endfor %} {% endif %} {% endwith %}

        <!-- LOGIN FORM -->
        <form method="POST" action="{{ url_for('admin.admin') }}">
          <div class="form-group">
            <label>Username</label>

            <input
              type="text"
              name="username"
              placeholder="Enter username"
              required
            />
          </div>

          <div class="form-group">
            <label>Password</label>

            <input
              type="password"
              name="password"
              placeholder="Enter password"
              required
            />
          </div>

          <button type="submit">Login</button>
        </form>

        <!-- FORGOT OPTIONS -->
      </br>
        <div class="forgot-links">
          <a href="{{ url_for('admin.forgot_username') }}">
            Forgot Username?
          </a>

          <a href="{{ url_for('admin.forgot_password') }}">
            Forgot Password?
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
