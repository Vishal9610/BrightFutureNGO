    <div class="main">
      <h1>Manage Gallery</h1>

      <hr />

      <h2>Upload New Gallery</h2>

<div class="manage-gallery">
  
      <form
        action="{{ url_for('gallery.gallery_upload') }}"
        method="POST"
        enctype="multipart/form-data"
      >
        <label> Gallery Title :</label>

        <br />
        <br/>

        <input
          type="text"
          name="title"
          placeholder="Example: School Bag Distribution"
          required
        />

         <br /><br />
         <br /><br />

        <label> Select Multiple Photos : </label>

        <br />
        <br/>

        <input type="file" name="images" multiple accept="image/*" required />

        <br /><br />
        <br /><br />
        <button type="submit">Upload Photos</button>
      </form>
       <br /><br />
      <a style="background:red;
      padding: 2px 10px 2px 10px;
        box-shadow: 0 0 12px black;
        color: #eff2f5;" href="{{ url_for('gallery.gallery_manage') }}"> Manage Gallery </a>
    </div>
</div>
  </body>
