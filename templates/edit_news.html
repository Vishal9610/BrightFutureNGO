<!doctype html>
<html>
  <head>
    <title>Edit News</title>
  </head>

  <body>
    <h2>Edit News</h2>

    <form method="POST">
      Title

      <br />

      <input type="text" name="title" value="{{ news[1] }}" />

      <br /><br />

      Description

      <br />

      <textarea name="description" rows="5" cols="50">{{ news[2] }}</textarea>

      <br /><br />

      Date

      <br />

      <input type="date" name="news_date" value="{{ news[3] }}" />

      <br /><br />

      <button>Update</button>
    </form>
  </body>
</html>
